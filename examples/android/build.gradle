plugins {
    id 'com.android.application'
}

android {
    namespace 'io.asternet.demo'
    compileSdk 36

    defaultConfig {
        applicationId 'io.asternet.demo'
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        // CMake externalNativeBuild（编译 C++ 核心 + JNI → libasternet-jni.so）
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2 -fexceptions'
                arguments '-DCMAKE_BUILD_TYPE=Release',
                          '-DASTERNET_ENABLE_XQUIC=ON',
                          '-DASTERNET_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                          '-DXQUIC_LIB_DIR=' + rootProject.projectDir.absolutePath + '/sdk/third_party/xquic/build-android-arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main.java.srcDirs += ['../../sdk/android/src/main/java']
    }

    packaging {
        jniLibs {
            excludes += ['**/libc++_shared.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
}
