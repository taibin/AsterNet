// AsterNet Android SDK — 产出 AAR（包含 16KB 对齐的 libasternet-jni.so + libasternet.so）
plugins {
    id 'com.android.library'
}

android {
    namespace 'io.asternet'
    compileSdk 36

    defaultConfig {
        minSdk 21
        targetSdk 36
        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2 -fexceptions'
                arguments '-DCMAKE_BUILD_TYPE=Release',
                          '-DASTERNET_ENABLE_XQUIC=ON',
                          '-DASTERNET_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                          '-DASTERNET_SHARED=ON'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            excludes += ['**/libc++_shared.so']
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
}
